[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy-ci"
version = "0.1.0"
description = "Application desktop pour superviser et piloter vos pipelines CI/CD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.3",
    "httpx>=0.27",
    "keyring>=25",
    "platformdirs>=4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.13"]
# Construction des applications autonomes (packaging/pyinstaller/easy-ci.spec).
build = ["pyinstaller>=6.16"]
# Génération des icônes et du logo (scripts/build_brand_assets.py).
brand = ["pillow>=10", "numpy>=1.26"]
# Sous Linux, pywebview a besoin d'un moteur de rendu : GTK (système) ou Qt.
qt = ["pywebview[qt]"]

[project.scripts]
easy-ci = "easy_ci.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_ci"]
# L'interface compilée est ignorée par git mais doit être embarquée dans le paquet.
artifacts = ["src/easy_ci/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 180
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B904"]
