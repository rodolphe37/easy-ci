[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy-ci"
version = "0.4.0"
description = "Desktop app to monitor, edit and generate CI/CD pipelines for GitHub Actions, GitLab CI/CD and Bitbucket Pipelines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rodolphe Augusto" }]
keywords = ["ci", "cd", "devops", "github-actions", "gitlab-ci", "bitbucket-pipelines", "desktop", "pywebview"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Natural Language :: French",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.3",
    "httpx>=0.27",
    "keyring>=25",
    "platformdirs>=4",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.13"]
# Construction des applications autonomes (packaging/pyinstaller/easy-ci.spec).
build = ["pyinstaller>=6.16"]
# Génération des icônes et du logo (scripts/build_brand_assets.py).
brand = ["pillow>=10", "numpy>=1.26"]
# Sous Linux, pywebview a besoin d'un moteur de rendu : GTK (système) ou Qt.
qt = ["pywebview[qt]"]

[project.urls]
Homepage = "https://github.com/rodolphe37/easy-ci"
Documentation = "https://github.com/rodolphe37/easy-ci#readme"
Issues = "https://github.com/rodolphe37/easy-ci/issues"
Changelog = "https://github.com/rodolphe37/easy-ci/blob/main/CHANGELOG.md"
Releases = "https://github.com/rodolphe37/easy-ci/releases"

[project.scripts]
easy-ci = "easy_ci.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_ci"]
# L'interface compilée est ignorée par git mais doit être embarquée dans le paquet.
artifacts = ["src/easy_ci/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 180
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B904"]
