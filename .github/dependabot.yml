# Mises à jour des dépendances : une pull request groupée par écosystème chaque semaine
# (versions mineures et correctifs), les versions majeures séparément.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
