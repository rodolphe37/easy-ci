name: CI

# Vérifications à chaque push sur main et à chaque pull request :
# lint Python, tests sur les trois systèmes, typage et compilation de l'interface.
# La construction des applications autonomes est dans package.yml et release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.13"
      - run: ruff check src tests scripts packaging

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        include:
          # Version minimale déclarée dans pyproject.toml.
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      # Aucun accès au trousseau du système pendant les tests.
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Git sans conversion de fins de ligne (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Installation
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  frontend:
    name: Interface (typage et build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build
