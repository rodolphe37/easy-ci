name: Build

# Workflow réutilisable : compile l'interface une seule fois, puis construit les applications
# autonomes (PyInstaller, non signées) sur chaque système et les publie comme artefacts zip.
# Appelé par package.yml (contrôle à chaque push sur main) et release.yml (versions publiées).
#
# macos-latest = Apple Silicon (arm64) ; macos-15-intel = dernière image Intel (x86_64) de GitHub.
# PyInstaller ne produit pas de binaires universels : deux constructions macOS sont nécessaires.

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Conserver les archives comme artefacts (nécessaire pour publier une version)
        type: boolean
        default: true
      retention-days:
        description: Durée de conservation des artefacts
        type: number
        default: 14
      ref:
        description: Commit ou tag à construire (par défaut, celui qui a déclenché le workflow)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  frontend:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilation
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: easy-ci-web
          path: src/easy_ci/web/
          retention-days: 1
          if-no-files-found: error

  app:
    name: Application (${{ matrix.label }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macOS arm64 }
          - { os: macos-15-intel, label: macOS x64 }
          - { os: windows-latest, label: Windows x64 }
          - { os: ubuntu-latest, label: Linux x64 }
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: easy-ci-web
          path: src/easy_ci/web

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Bibliothèques Qt WebEngine (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2t64 libfontconfig1 libdbus-1-3

      - name: Installation
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then extras="build,qt"; else extras="build"; fi
          pip install -e ".[$extras]"

      - name: Construction PyInstaller
        run: pyinstaller packaging/pyinstaller/easy-ci.spec --noconfirm

      - name: Vérification de l'application construite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            macOS)   dist/EasyCI.app/Contents/MacOS/EasyCI --self-check ;;
            Windows) dist/EasyCI/EasyCI.exe --self-check ;;
            Linux)   dist/EasyCI/EasyCI --self-check ;;
          esac

      - name: Archive zip
        id: archive
        shell: bash
        run: |
          arch="${RUNNER_ARCH}"
          mkdir -p release-assets
          case "$RUNNER_OS" in
            macOS)
              # ditto conserve les attributs étendus dont dépend la signature ad hoc du .app
              # (zip les perd : l'app apparaîtrait « endommagée » dans le Finder).
              name="EasyCI-macOS-${arch}.zip"
              (cd dist && ditto -c -k --keepParent "EasyCI.app" "../release-assets/${name}")
              ;;
            Windows)
              name="EasyCI-Windows-${arch}.zip"
              (cd dist && 7z a -tzip "../release-assets/${name}" "EasyCI" > /dev/null)
              ;;
            Linux)
              name="EasyCI-Linux-${arch}.zip"
              cp packaging/linux/easy-ci.desktop packaging/linux/install.sh src/easy_ci/resources/icon.png dist/EasyCI/
              (cd dist && zip -qry "../release-assets/${name}" "EasyCI")
              ;;
          esac
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # Les scripts d'installation publiés (curl | bash, irm | iex) sont testés sur l'archive
      # qui vient d'être construite, puis l'application installée est vérifiée.
      - name: Test du script d'installation (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          EASY_CI_ARCHIVE: ${{ github.workspace }}/release-assets/${{ steps.archive.outputs.name }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            EASY_CI_INSTALL_DIR="$RUNNER_TEMP/Applications" bash packaging/macos/install.sh
            "$RUNNER_TEMP/Applications/EasyCI.app/Contents/MacOS/EasyCI" --self-check
          else
            export XDG_DATA_HOME="$RUNNER_TEMP/share" HOME="$RUNNER_TEMP/home"
            bash packaging/linux/install.sh
            "$HOME/.local/bin/easy-ci" --self-check
            test -f "$XDG_DATA_HOME/applications/easy-ci.desktop"
            bash "$XDG_DATA_HOME/easy-ci/install.sh" --uninstall
            test ! -e "$XDG_DATA_HOME/easy-ci"
          fi

      - name: Test du script d'installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:EASY_CI_ARCHIVE = (Resolve-Path "release-assets/${{ steps.archive.outputs.name }}").Path
          $env:EASY_CI_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "EasyCI"
          ./packaging/windows/install.ps1
          $exe = Join-Path $env:EASY_CI_INSTALL_DIR "EasyCI.exe"
          $check = Start-Process -FilePath $exe -ArgumentList "--self-check" -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "--self-check a échoué après installation ($($check.ExitCode))." }
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $version) { throw "Métadonnées de version absentes de EasyCI.exe." }
          Write-Host "EasyCI.exe version $version"

      - uses: actions/upload-artifact@v7
        if: inputs.upload-artifacts
        with:
          # runner.arch distingue les deux constructions macOS (noms d'artefacts uniques).
          name: easy-ci-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/${{ steps.archive.outputs.name }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          compression-level: 0
