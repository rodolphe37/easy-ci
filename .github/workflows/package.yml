name: Package

# Vérifie à chaque push sur main que les applications autonomes se construisent, démarrent
# (--self-check) et s'installent avec les scripts publiés, sur les quatre plateformes.
# Les archives ne sont pas conservées (plusieurs centaines de Mo par exécution) : pour les
# récupérer, lancer ce workflow à la main avec « Conserver les archives ».
# Pas de déclenchement sur les pull requests : seules les modifications intégrées sont construites.
# Les téléchargements publics passent par les GitHub Releases (release.yml).

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build.yml"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      keep-archives:
        description: Conserver les archives 3 jours (onglet Artifacts de l'exécution)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload-artifacts: ${{ github.event_name == 'workflow_dispatch' && inputs.keep-archives }}
      retention-days: 3
